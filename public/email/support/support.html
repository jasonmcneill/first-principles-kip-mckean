<div id="fp-kip-mckean-support">
  <h2 style="font-size: 1.3rem; margin-bottom: 1.3rem 0; padding: 0">
    NEW SUPPORT REQUEST
  </h2>

  <div style="font-size: 1rem">
    <p style="margin: 1.3rem 0">
      A request for support has been received from the First Principles web
      site. Reply to this message to respond.
    </p>

    <div style="margin: 1.3rem 0">
      <table
        cellpadding="5"
        cellspacing="0"
        border="0"
        class="table table-striped"
      >
        <tr>
          <td align="right"><strong>Date:</strong></td>
          <td>{DATE}</td>
        </tr>
        <tr>
          <td align="right"><strong>Name:</strong></td>
          <td>{FIRSTNAME} {LASTNAME}</td>
        </tr>
        <tr>
          <td align="right"><strong>User ID:</strong></td>
          <td>{USERID}</td>
        </tr>
        <tr>
          <td align="right"><strong>E-mail:</strong></td>
          <td>{EMAIL}</td>
        </tr>
      </table>
    </div>

    <div style="margin: 1.3rem 0">
      <strong>Message:</strong><br />
      <blockquote
        style="
          border: 1px solid gainsboro;
          margin: 0.5rem 0 1rem 0;
          padding: 1rem;
        "
      >
        {MESSAGE}
      </blockquote>
    </div>
  </div>
</div>
